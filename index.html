<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 学习引擎 · 凝练 20% · 课程化 · 可验收</title>
<style>
  :root{
    --c1:#534AB7; --c1-bg:#EEEDFE;   /* 核心概念：紫 */
    --c2:#3B6D11; --c2-bg:#EAF3DE;   /* 课程计划：绿 */
    --c3:#BA7517; --c3-bg:#FAEEDA;   /* 实战项目：橙 */
    --c4:#185FA5; --c4-bg:#E6F1FB;   /* 检验：蓝 */
    --ink:#1f2024; --muted:#6b6f76; --line:#e6e3db; --bg:#f6f5f1; --card:#fff;
    --ok:#0a7c2f; --err:#b3261e;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);background:var(--bg);line-height:1.65;font-size:15px;-webkit-text-size-adjust:100%}
  .wrap{max-width:980px;margin:0 auto;padding:18px 14px 80px}
  header{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin-bottom:14px}
  header h1{margin:0 0 4px;font-size:20px}
  header p{margin:0;color:var(--muted);font-size:13px}
  .card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin-bottom:12px}
  .card h2{margin:0 0 10px;font-size:17px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:600}
  .tag.c1{background:var(--c1-bg);color:var(--c1)}
  .tag.c2{background:var(--c2-bg);color:var(--c2)}
  .tag.c3{background:var(--c3-bg);color:var(--c3)}
  .tag.c4{background:var(--c4-bg);color:var(--c4)}

  /* 顶部输入栏 */
  .gen{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin-bottom:14px}
  .gen .row{display:grid;grid-template-columns:1fr 1fr 130px;gap:10px;margin-bottom:10px}
  @media(max-width:680px){.gen .row{grid-template-columns:1fr 1fr}}
  .gen input,.gen select{font:inherit;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);outline:none;width:100%}
  .gen input:focus,.gen select:focus{border-color:var(--c1)}
  .gen .actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .btn{font:inherit;font-weight:600;border:0;border-radius:10px;padding:9px 14px;cursor:pointer;color:#fff;background:var(--c1)}
  .btn:hover{opacity:.92}
  .btn.secondary{background:#fff;color:var(--ink);border:1px solid var(--line);font-weight:500}
  .btn.secondary:hover{background:#fafaf6}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .linkbtn{background:none;border:0;color:var(--c1);cursor:pointer;font:inherit;padding:4px 6px}
  .linkbtn:hover{text-decoration:underline}

  .status{margin-top:8px;font-size:13px;line-height:1.6}
  .status .note{color:var(--muted)}
  .status .ok{color:var(--ok)}
  .status .err{color:var(--err)}
  .status .err details{margin-top:6px;padding:8px 10px;background:#fff5f5;border:1px solid #f3d4d1;border-radius:8px}
  .status .err summary{cursor:pointer;color:var(--err);font-weight:600}

  /* 结果区 */
  .hero{padding:18px 20px}
  .hero h2{font-size:22px;margin:0 0 4px}
  .hero .oneliner{margin:0;color:var(--muted);font-size:14px}
  .meta-bar{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}

  /* 核心概念 */
  .concepts{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
  .concept{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:#fff}
  .concept .name{font-weight:600;font-size:15px;margin-bottom:4px;display:flex;justify-content:space-between;align-items:center;gap:8px}
  .concept .name .pct{font-size:11px;padding:1px 7px;border-radius:999px;background:var(--c1-bg);color:var(--c1);font-weight:700}
  .concept .why{margin:0 0 6px;color:#444;font-size:13.5px}
  .concept .pitfall{margin:0;color:var(--err);font-size:12.5px}

  /* 课程 */
  .lessons{display:flex;flex-direction:column;gap:10px}
  .lesson{border:1px solid var(--line);border-radius:12px;background:#fff;overflow:hidden}
  .lesson summary{list-style:none;cursor:pointer;padding:12px 14px;font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .lesson summary::-webkit-details-marker{display:none}
  .lesson summary::before{content:"▸";color:var(--c2);transition:transform .15s;display:inline-block;width:14px}
  .lesson[open] summary::before{transform:rotate(90deg)}
  .lesson summary .badge{margin-left:auto;background:var(--c2-bg);color:var(--c2);font-size:11px;padding:2px 8px;border-radius:999px;font-weight:600}
  .lesson-body{padding:0 14px 14px;display:grid;gap:8px}
  .lesson-body .row{font-size:13.5px}
  .lesson-body .row b{color:var(--c2);display:block;margin-bottom:2px;font-size:12px;font-weight:600}
  .lesson-body ul{margin:0;padding-left:20px}
  .lesson-body li{margin-bottom:3px}
  .res{display:inline-block;background:#f6f5f1;border:1px solid var(--line);border-radius:8px;padding:3px 9px;margin:2px 4px 2px 0;font-size:12.5px}
  .res .t{color:var(--muted);font-size:11px;margin-right:4px}

  /* 实战项目 */
  .project{border:1px solid var(--c3);border-radius:12px;background:#fff;padding:14px 16px;margin-bottom:10px}
  .project h3{margin:0 0 4px;font-size:16px;color:var(--c3)}
  .project .sub{color:var(--muted);font-size:13px;margin-bottom:10px}
  .project .deliv{background:var(--c3-bg);border-radius:8px;padding:8px 10px;margin:8px 0;font-size:13.5px}
  .milestones{display:flex;flex-direction:column;gap:6px;margin:8px 0}
  .ms{display:grid;grid-template-columns:42px 1fr;gap:8px;align-items:start;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fcfbf7}
  .ms .d{font-weight:700;color:var(--c3);text-align:center;background:#fff;border:1px solid var(--c3);border-radius:6px;padding:3px 0;font-size:12px}
  .ms .t{font-size:13.5px}
  .ms .c{color:var(--muted);font-size:12px;display:block;margin-top:2px}
  .checks{background:#fcfbf7;border:1px dashed var(--c3);border-radius:10px;padding:10px 14px;margin-top:10px}
  .checks h4{margin:0 0 6px;font-size:13px;color:var(--c3)}
  .checks label{display:flex;gap:6px;align-items:start;padding:3px 0;font-size:13.5px;cursor:pointer}

  /* 检验 */
  .review-list{font-size:13.5px}
  .review-list li{margin-bottom:4px}

  /* 历史 */
  .hist{display:flex;flex-wrap:wrap;gap:6px}
  .hist-item{background:#fff;border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-size:12.5px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
  .hist-item:hover{border-color:var(--c1)}
  .hist-item .star{color:#d4a72c}
  .hist-item .x{color:var(--muted);margin-left:2px}
  .hist-item .x:hover{color:var(--err)}

  /* 设置面板 */
  details.set{border:1px solid var(--line);border-radius:14px;background:#fff;padding:10px 14px;margin-top:10px}
  details.set>summary{list-style:none;cursor:pointer;font-weight:600;font-size:14px}
  details.set>summary::-webkit-details-marker{display:none}
  details.set>summary::before{content:"⚙ ";opacity:.7}
  .set-body{margin-top:10px;display:grid;gap:8px}
  .set-row{display:grid;grid-template-columns:130px 1fr;gap:8px;align-items:center;font-size:13px}
  .set-row input,.set-row select{font:inherit;padding:6px 9px;border:1px solid var(--line);border-radius:8px;width:100%;background:#fff}

  /* 工具类 */
  .hidden{display:none!important}
  .empty{text-align:center;color:var(--muted);padding:30px 16px;font-size:14px}
  .spinner{display:inline-block;width:14px;height:14px;border:2px solid var(--c1);border-top-color:transparent;border-radius:50%;animation:spin .8s linear infinite;vertical-align:middle;margin-right:6px}
  @keyframes spin{to{transform:rotate(360deg)}}
  details>summary{cursor:pointer}
  .row-act{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .copy-btn{font-size:12px;padding:4px 8px;border:1px solid var(--line);background:#fff;border-radius:6px;cursor:pointer;color:var(--muted)}
  .copy-btn:hover{color:var(--ink);border-color:var(--ink)}
  @media print{
    body{background:#fff}
    .gen,.row-act,.hist details.set{display:none!important}
    .card{break-inside:avoid;border:1px solid #ddd;box-shadow:none}
  }
</style>
</head>
<body>
<div class="wrap">

<header>
  <h1>AI 学习引擎 <span style="color:var(--muted);font-weight:400;font-size:13px">· 凝练 20% · 课程化 · 可验收</span></h1>
  <p>输入一个领域，AI 凝练其最核心的 20% 概念与技能、拆成几次可执行课、附一个能证明「真的会用」的实战小项目。</p>
</header>

<!-- 输入区 -->
<div class="gen">
  <div class="row">
    <input id="domain" placeholder="学习领域（必填），如：初二数学 / 雅思口语 / Python 入门">
    <input id="goal" placeholder="目标/用途（可选），如：3 个月内能考到 6.5 分">
    <select id="level">
      <option value="零基础">零基础</option>
      <option value="入门">入门</option>
      <option value="进阶">进阶</option>
      <option value="专家">专家</option>
    </select>
  </div>
  <div class="actions">
    <button class="btn" id="gen">生成学习手册</button>
    <button class="btn secondary" id="exportMd" disabled>📥 导出 Markdown</button>
    <button class="linkbtn" id="openSet">⚙ 设置</button>
  </div>
  <div id="status" class="status"></div>

  <details class="set" id="setPanel">
    <summary>设置（API Key · 中转服务 · 模型名）</summary>
    <div class="set-body">
      <div class="set-row">
        <label>服务商</label>
        <select id="provider">
          <option value="zhipu">智谱 GLM（推荐·国内免费层）</option>
          <option value="deepseek">DeepSeek（强推理·便宜）</option>
          <option value="qwen">通义千问（阿里·免费层）</option>
          <option value="moonshot">月之暗面 Kimi</option>
          <option value="siliconflow">硅基流动（白嫖多家）</option>
          <option value="openai">OpenAI（国内需代理）</option>
          <option value="custom">自定义</option>
        </select>
      </div>
      <div class="set-row"><label>API Base URL</label><input id="base" placeholder="如：https://api.deepseek.com/v1"></div>
      <div class="set-row"><label>API Key</label><input id="key" type="password" placeholder="sk-…（仅本机浏览器保存）"></div>
      <div class="set-row"><label>模型名</label><input id="model" placeholder="如：glm-4-flash / deepseek-chat / qwen-plus"></div>
      <div class="set-row">
        <label>中转模式</label>
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
          <label style="display:flex;align-items:center;gap:4px"><input type="checkbox" id="relayOn"> 启用</label>
          <input id="relayUrl" placeholder="https://你的中转/generate" style="flex:1;min-width:200px">
          <input id="relayToken" type="password" placeholder="口令（可选）" style="max-width:120px">
        </div>
      </div>
      <div class="set-row" style="text-align:right">
        <label></label>
        <div style="display:flex;gap:8px">
          <button class="btn secondary" id="saveSet">保存</button>
          <button class="btn secondary" id="clearSet">清除</button>
        </div>
      </div>
      <div style="font-size:12px;color:var(--muted)">
        <b>第一次用：</b>1) 选服务商 · 2) 注册该平台拿 Key · 3) 粘到 API Key · 4) 回到主页点「生成」。或启用「中转模式」让别人共享的 Key 替你跑（Key 不出现在浏览器）。
      </div>
    </div>
  </details>
</div>

<!-- 结果区 -->
<div id="result"></div>

<!-- 历史 -->
<div class="card" id="histCard" style="display:none">
  <h2>📚 历史计划</h2>
  <div class="hist" id="hist"></div>
</div>

</div>

<!-- ============= JS ============= -->
<script src="relay-config.js"></script>
<script>
"use strict";

/* ===== 1. 预设 ===== */
const PRESETS={
  zhipu:{base:"https://open.bigmodel.cn/api/paas/v4", model:"glm-4-flash"},
  deepseek:{base:"https://api.deepseek.com/v1", model:"deepseek-chat"},
  qwen:{base:"https://dashscope.aliyuncs.com/compatible-mode/v1", model:"qwen-plus"},
  moonshot:{base:"https://api.moonshot.cn/v1", model:"moonshot-v1-8k"},
  siliconflow:{base:"https://api.siliconflow.cn/v1", model:"Qwen/Qwen2.5-72B-Instruct"},
  openai:{base:"https://api.openai.com/v1", model:"gpt-4o-mini"},
  custom:{base:"", model:""}
};
const RELAY_CFG = (typeof window.APP_RELAY==="object" && window.APP_RELAY) ? window.APP_RELAY : {};
const DEFAULT_RELAY = RELAY_CFG.url || "";
const DEFAULT_RELAY_TOKEN = RELAY_CFG.token || "";

/* ===== 2. 设置持久化 ===== */
function loadSettings(){
  const raw=localStorage.getItem("aiLearn.v2.settings");
  if(!raw){
    $("#provider").value="zhipu"; applyPreset();
    if(DEFAULT_RELAY){
      $("#relayOn").checked=true;
      $("#relayUrl").value=DEFAULT_RELAY;
      if(DEFAULT_RELAY_TOKEN) $("#relayToken").value=DEFAULT_RELAY_TOKEN;
    }
    return;
  }
  try{
    const s=JSON.parse(raw);
    if(s.provider)$("#provider").value=s.provider;
    if(s.base)$("#base").value=s.base;
    if(s.key)$("#key").value=s.key;
    if(s.model)$("#model").value=s.model;
    if(s.relayOn)$("#relayOn").checked=!!s.relayOn;
    if(s.relayUrl)$("#relayUrl").value=s.relayUrl;
    if(s.relayToken)$("#relayToken").value=s.relayToken;
  }catch(e){}
}
function saveSettings(){
  const s={
    provider:$("#provider").value,
    base:$("#base").value.trim(),
    key:$("#key").value.trim(),
    model:$("#model").value.trim(),
    relayOn:$("#relayOn").checked,
    relayUrl:$("#relayUrl").value.trim(),
    relayToken:$("#relayToken").value.trim()
  };
  localStorage.setItem("aiLearn.v2.settings", JSON.stringify(s));
  flash("ok","设置已保存");
}
function getSettings(){
  return {
    provider:$("#provider").value,
    base:$("#base").value.trim(),
    key:$("#key").value.trim(),
    model:$("#model").value.trim(),
    relayOn:$("#relayOn").checked,
    relayUrl:$("#relayUrl").value.trim(),
    relayToken:$("#relayToken").value.trim()
  };
}
function applyPreset(){
  const p=$("#provider").value;
  const v=PRESETS[p]||PRESETS.custom;
  $("#base").value=v.base;
  $("#model").value=v.model;
}
function $(s){return document.querySelector(s)}

/* ===== 3. 提示词：单一生成，返回 3 大段 ===== */
const SYS = `你是一位顶级的学习设计师，擅长把任何领域凝练为「20% 核心 + 几次课 + 一个能证明会用的实战项目」。

严格要求：
1. 所有书/课/网站必须给具体名称（人教版/可汗学院/B 站关键词/Anki 卡组等），禁止"相关教材""网上资料"等空话。
2. 练习必须是可数可执行的具体动作（"做 10 道" "30 分钟" "找一个朋友讲 3 分钟"），不是"多做练习"。
3. 复习题是问答题或操作题，不是"理解本章"。
4. 实战项目的 milestone 必须按"第 X 天：具体任务 + 验收标准"格式，每条都能在当天被检查是否完成。
5. 输出的 20% 核心概念数量 = 6~8 个，weight 是占比（加起来=100），按重要性从高到低排。
6. 课的数量 = 5~7 节，按依赖顺序排，每节聚焦 1~3 个核心概念。
7. 直接返回 JSON，禁止 markdown 代码块，禁止任何解释文字。`;

/* 用户提示词（更具体） */
const USER_PROMPT = d=>`领域：${d.domain}
目标：${d.goal || "（用户未填，默认：能用、能讲清）"}
水平：${d.level}

请按以下 JSON 格式输出（不要任何多余文字）：

{
  "title": "领域名",
  "oneLiner": "一句话定位这个领域是什么、学到什么程度算入门（30 字内）",
  "core20": [
    {"name":"概念名","weight": 15, "why":"为什么是核心（30 字内）","pitfall":"最易错/最常误解点（20 字内）"},
    …6~8 个，按重要性降序，weight 之和 = 100
  ],
  "lessons": [
    {
      "n": 1,
      "title": "第1课:xxx",
      "goal": "学完能…（用动作描述）",
      "concepts": ["涉及的核心概念名"],
      "exercises": ["具体练习1（含数量/时长）","具体练习2","具体练习3"],
      "resources": [
        {"type":"教材","name":"具体书名/版本"},
        {"type":"视频","name":"具体课程名或搜索词"},
        {"type":"工具","name":"具体 APP/网站"}
      ],
      "review": ["问答题或操作题1","问答题或操作题2"]
    },
    …5~7 节
  ],
  "capstone": {
    "title": "可验收实战项目名",
    "duration": "X天",
    "deliverable": "最终可交付物（具体形式）",
    "milestones": [
      {"day": 3, "task": "具体任务", "check": "如何验收这一天"},
      …5~8 个 milestones，day 递增
    ],
    "finalCheck": ["最终验收标准1（可观察/可测量）","最终验收标准2","最终验收标准3"]
  }
}`;

/* ===== 4. JSON 解析（含自动修复） ===== */
function repairTruncatedJSON(s){
  let inStr=false, esc=false;
  const stack=[];
  for(let i=0;i<s.length;i++){
    const c=s[i];
    if(esc){ esc=false; continue; }
    if(c==='\\'){ esc=true; continue; }
    if(c==='"'){ inStr=!inStr; continue; }
    if(!inStr){
      if(c==='{') stack.push('}');
      else if(c==='[') stack.push(']');
      else if(c==='}'||c===']') stack.pop();
    }
  }
  if(inStr) s += '"';
  while(stack.length) s += stack.pop();
  return s;
}
function parseJSON(txt){
  let t=txt.trim();
  t=t.replace(/^```(?:json)?\s*/i,'').replace(/```\s*$/,'').trim();
  try{ return JSON.parse(t); }catch(_){}
  const m=t.match(/\{[\s\S]*\}/);
  if(m){
    try{ return JSON.parse(m[0]); }catch(_){}
    try{ return JSON.parse(repairTruncatedJSON(m[0])); }catch(_){}
  }
  try{ return JSON.parse(repairTruncatedJSON(t)); }catch(_){}
  throw new Error("模型返回的不是合法 JSON。原始内容（前 200 字）："+t.slice(0,200));
}

/* ===== 5. API 调用（带 1 次重试） ===== */
async function callAI(userPrompt){
  const s=getSettings();
  if(s.relayOn && s.relayUrl){
    return await callRelayWithRetry(userPrompt, s);
  }
  if(!s.base||!s.key||!s.model) throw new Error("请先在 ⚙ 设置 中填写 API Key、Base URL 和模型名，或启用「中转模式」。");
  return await callDirectWithRetry(userPrompt, s);
}
async function callDirectWithRetry(userPrompt, s){
  const target=s.base.replace(/\/$/,"")+"/chat/completions";
  const url = s.proxyOn ? (s.proxyUrl.replace(/\/$/,"")+"/?url="+encodeURIComponent(target)) : target;
  for(let attempt=0; attempt<2; attempt++){
    const body={model:s.model, messages:[{role:"system",content:SYS},{role:"user",content:userPrompt}], temperature:0.6};
    if(attempt===1) body.messages[1].content += "\n\n【重申】只返回完整 JSON，禁止任何解释文字，禁止代码块围栏，禁止截断！";
    const res=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+s.key},body:JSON.stringify(body)});
    if(!res.ok){ const t=await res.text().catch(()=>""); throw new Error("API "+res.status+"："+t.slice(0,180)); }
    const j=await res.json();
    const txt=j.choices?.[0]?.message?.content;
    if(!txt) throw new Error("API 未返回内容");
    try{ return parseJSON(txt); }
    catch(e){
      if(attempt===0){ console.warn("JSON parse fail, retrying...", e.message); continue; }
      throw e;
    }
  }
}
async function callRelayWithRetry(userPrompt, s){
  for(let attempt=0; attempt<2; attempt++){
    const body={provider:s.provider, model:s.model, messages:[{role:"system",content:SYS},{role:"user",content:userPrompt}], temperature:0.6};
    if(attempt===1) body.messages[1].content += "\n\n【重申】只返回完整 JSON，禁止任何解释文字，禁止代码块围栏，禁止截断！";
    if(s.relayToken) body.token=s.relayToken;
    const res=await fetch(s.relayUrl.replace(/\/$/,""),{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
    if(!res.ok){ const t=await res.text().catch(()=>""); throw new Error("中转 "+res.status+"："+t.slice(0,180)); }
    const j=await res.json();
    const txt=j.choices?.[0]?.message?.content;
    if(!txt) throw new Error("中转未返回内容");
    try{ return parseJSON(txt); }
    catch(e){
      if(attempt===0){ console.warn("JSON parse fail, retrying via relay...", e.message); continue; }
      throw e;
    }
  }
}

/* ===== 6. 渲染 ===== */
function esc(s){ return String(s||"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]); }

function renderPlan(data){
  const r=$("#result");
  r.innerHTML="";

  const hero=document.createElement("div");
  hero.className="card hero";

    <h2>${esc(data.title||"")}</h2>

    <div class="meta-bar">

    <p style="margin:0 0 10px;color:var(--muted);font-size:13px">按重要性排序；掌握前 5 个就入门，掌握全部 7~8 个就超越多数自学者的水平。</p>

    <div class="lessons">${(data.lessons||[]).map(L=>`
      <details class="lesson" ${L.n===1?"open":""}>
        <summary>${esc(L.title||"第"+L.n+"课")} <span class="badge">${(L.concepts||[]).length} 概念</span></summary>
        <div class="lesson-body">
          <div class="row"><b>学习目标</b>${esc(L.goal||"")}</div>
          <div class="row"><b>涉及概念</b>${(L.concepts||[]).map(x=>`<span class="res">${esc(x)}</span>`).join("")}</div>
          <div class="row"><b>练习内容</b><ul>${(L.exercises||[]).map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>
          <div class="row"><b>参考资源</b>${(L.resources||[]).map(x=>`<span class="res"><span class="t">${esc(x.type||"")}</span>${esc(x.name||"")}</span>`).join("")||'<span style="color:var(--muted)">无</span>'}</div>
          <div class="row"><b>复习题</b><ul class="review-list">${(L.review||[]).map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>

/* ===== 7. 导出 Markdown ===== */
function toMarkdown(data){
  let md=`# ${data.title||""}\n\n> ${data.oneLiner||""}\n\n`;
  md+=`## 🎯 20% 核心概念\n\n`;
  (data.core20||[]).forEach(c=>{
    md+=`- **${c.name}**（${c.weight}%）—— ${c.why}  ⚠ ${c.pitfall}\n`;
  });
  md+=`\n## 📚 课程计划\n\n`;
  (data.lessons||[]).forEach(L=>{
    md+=`### ${L.title}\n- **学习目标**：${L.goal}\n- **涉及概念**：${(L.concepts||[]).join("、")}\n`;
    md+=`- **练习内容**：\n${(L.exercises||[]).map(x=>"  - "+x).join("\n")}\n`;
    md+=`- **参考资源**：${(L.resources||[]).map(x=>`\`${x.type}\` ${x.name}`).join("；")}\n`;
    md+=`- **复习题**：\n${(L.review||[]).map(x=>"  - "+x).join("\n")}\n\n`;
  });
  if(data.capstone){
    const P=data.capstone;
    md+=`## 🚀 实战项目：${P.title}\n\n**周期**：${P.duration}\n\n**交付物**：${P.deliverable}\n\n### 里程碑\n`;
    (P.milestones||[]).forEach(m=>md+=`- [ ] **第 ${m.day} 天**：${m.task}　📌 ${m.check}\n`);
    md+=`\n### 最终验收\n`;
    (P.finalCheck||[]).forEach(x=>md+=`- [ ] ${x}\n`);
  }
  return md;
}
function copyAsMarkdown(data){
  const md=toMarkdown(data);
  navigator.clipboard?.writeText(md).then(()=>flash("ok","📋 Markdown 已复制到剪贴板")).catch(()=>{
    // fallback
    const ta=document.createElement("textarea"); ta.value=md; document.body.appendChild(ta); ta.select();
    document.execCommand("copy"); document.body.removeChild(ta); flash("ok","📋 已复制");
  });
}
function downloadMd(data){
  const md=toMarkdown(data);
  const blob=new Blob([md],{type:"text/markdown;charset=utf-8"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download=(data.title||"学习手册")+".md";
  a.click(); URL.revokeObjectURL(a.href);
}

/* ===== 8. 历史 ===== */
const HISTORY_KEY="aiLearn.v2.history";
function loadHistory(){ try{return JSON.parse(localStorage.getItem(HISTORY_KEY))||[]}catch{return[]} }
function saveHistory(arr){ localStorage.setItem(HISTORY_KEY, JSON.stringify(arr)); }
function pushHistory(domain, data){
  const arr=loadHistory();
  const i=arr.findIndex(x=>x.domain===domain);
  const item={domain, data, createdAt:Date.now()};
  if(i>=0) arr[i]=item; else arr.push(item);
  if(arr.length>20) arr=arr.slice(-20);
  saveHistory(arr);
  renderHistory();
}
function renderHistory(){
  const list=loadHistory().slice().reverse();
  const card=$("#histCard"); const w=$("#hist");
  if(!list.length){ card.style.display="none"; return; }
  card.style.display="";
  w.innerHTML=list.map(it=>{
    const d=new Date(it.createdAt);
    const dateStr=`${d.getMonth()+1}/${d.getDate()}`;
    return `<span class="hist-item" data-domain="${esc(it.domain)}">
      <span>${esc(it.domain)}</span>
      <span style="color:var(--muted);font-size:11px">${dateStr}</span>
    </span>`;
  }).join("");
  w.querySelectorAll(".hist-item").forEach(el=>{
    el.addEventListener("click", ()=>{
      const item=loadHistory().find(x=>x.domain===el.dataset.domain);
      if(item){ renderPlan(item.data); window.scrollTo({top:0,behavior:"smooth"}); }
    });
  });
}

/* ===== 9. 状态提示 ===== */
function flash(type, msg, extra){
  const c={"ok":"ok","err":"err","note":"note"}[type]||"note";
  let html=`<div class="${c}">${esc(msg)}`;
  if(extra) html+=`<details><summary>查看错误详情（可点击展开）</summary><pre style="white-space:pre-wrap;font-size:12px;margin:6px 0 0">${esc(extra)}</pre></details>`;
  html+=`</div>`;
  $("#status").innerHTML=html;
}

/* ===== 10. 主流程 ===== */
async function generate(){
  const domain=$("#domain").value.trim();
  if(!domain){ flash("err","请先填写学习领域"); return; }
  const goal=$("#goal").value.trim();
  const level=$("#level").value;
  const s=getSettings();
  if(!s.relayOn && (!s.key||!s.base||!s.model)){ flash("err","请先在 ⚙ 设置 中填 API Key（或启用中转模式）"); document.getElementById("setPanel").open=true; return; }

  const genBtn=$("#gen");
  genBtn.disabled=true;
  $("#exportMd").disabled=true;
  flash("note",`<span class="spinner"></span>正在为「${esc(domain)}」凝练核心、设计课程、规划实战项目…（1 次生成，约 10~25 秒）`);

  try{
    const data=await callAI(USER_PROMPT({domain, goal, level}));
    if(!data.core20 || !data.lessons || !data.capstone){
      throw new Error("模型返回缺少关键字段（core20/lessons/capstone），原始数据："+JSON.stringify(data).slice(0,200));
    }
    renderPlan(data);
    pushHistory(domain, data);
    $("#exportMd").disabled=false;
    $("#exportMd").onclick=()=>downloadMd(data);
    flash("ok","✅ 学习手册已生成。已自动保存到「历史计划」。");
    window.scrollTo({top:$("#result").offsetTop-20, behavior:"smooth"});
  }catch(e){
    flash("err","生成失败："+e.message, e.message);
  }finally{
    genBtn.disabled=false;
  }
}

/* ===== 11. 事件绑定 ===== */
document.getElementById("gen").addEventListener("click", generate);
document.getElementById("openSet").addEventListener("click", ()=>document.getElementById("setPanel").open=true);
document.getElementById("provider").addEventListener("change", applyPreset);
document.getElementById("saveSet").addEventListener("click", saveSettings);
document.getElementById("clearSet").addEventListener("click", ()=>{
  localStorage.removeItem("aiLearn.v2.settings");
  $("#base").value=""; $("#key").value=""; $("#model").value=""; $("#relayUrl").value=""; $("#relayToken").value="";
  flash("note","已清除设置");
});

/* ===== 12. 初始化 ===== */
loadSettings();
renderHistory();
if(DEFAULT_RELAY){
  flash("ok","✓ 中转模式已默认启用（Key 在服务器，浏览器无 Key）");
}
